name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run for the same branch/PR when a newer push lands,
# so pushing twice in a row doesn't burn CI time on a run nobody will look at.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  backend:
    name: Backend (install, migrate, test on Postgres 17)
    runs-on: ubuntu-latest
    # A real, throwaway Postgres for this run only. 17 is what Supabase runs;
    # PGlite (used on laptops without Docker) is a newer major version, so
    # CI is where the production engine is actually tested.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Steps start only once Postgres accepts connections.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      # Only ever this container: the test helpers refuse any non-local host.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      # The real CLI, the way production is migrated, on an empty Postgres 17.
      # --check then exits non-zero if the result differs from the migrations.
      - name: Apply migrations and check for drift
        working-directory: server
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          npm run migrate -- --yes
          npm run migrate -- --check

      # Uses Node's built-in test runner (see server/package.json) — no
      # extra framework dependency needed. Integration tests in test/ each
      # create their own database on the container above.
      - name: Run tests
        working-directory: server
        run: npm test

      # Backstop for everything the test suite above doesn't import/exercise
      # directly: every source file must at least parse. Catches typos/
      # syntax errors in routes or services before they ever reach a deploy.
      - name: Syntax-check source files
        working-directory: server
        run: find src scripts test -name "*.js" -exec node --check {} +
