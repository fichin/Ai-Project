name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run for the same branch/PR when a newer push lands,
# so pushing twice in a row doesn't burn CI time on a run nobody will look at.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  backend:
    name: Backend (install, test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      # Uses Node's built-in test runner (see server/package.json) — no
      # extra framework dependency needed.
      - name: Run tests
        working-directory: server
        run: npm test

      # Backstop for everything the test suite above doesn't import/exercise
      # directly: every source file must at least parse. Catches typos/
      # syntax errors in routes or services before they ever reach a deploy.
      - name: Syntax-check source files
        working-directory: server
        run: find src -name "*.js" -exec node --check {} +
