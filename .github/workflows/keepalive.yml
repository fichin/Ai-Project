name: Keepalive

# Pings the live demo daily and alerts through a GitHub issue when it is down.
# Pinging alone did not stop Supabase from pausing the free project in
# Nov 2026, so the goal is fast detection, not just keeping it awake.
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-live-demo:
    name: Check live demo health
    runs-on: ubuntu-latest
    # Worst case is two endpoints x (4 attempts x 90s + 3 waits x 15s) ~ 13.5 min.
    timeout-minutes: 20
    env:
      BASE_URL: https://ai-project-phi-sand.vercel.app
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check health
        id: health
        working-directory: server
        # Explicit `shell: bash` adds -o pipefail, so the step fails when the
        # script fails instead of taking tee's exit code.
        shell: bash
        run: node scripts/checkHealth.js "$BASE_URL" | tee health.log

      - name: Open or update outage issue
        if: failure()
        env:
          STATUS: ${{ steps.health.outputs.status || 'unknown' }}
        run: |
          gh label create outage --color B60205 --description "Live demo is down" --force
          body="$(printf 'Status: `%s`\n\n%s\n\nRun: %s' "$STATUS" "$(cat server/health.log 2>/dev/null)" "$RUN_URL")"
          existing="$(gh issue list --state open --label outage --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Live demo is down ($STATUS)" --label outage --body "$body"
          fi

      - name: Close outage issue after recovery
        if: success()
        run: |
          for number in $(gh issue list --state open --label outage --json number --jq '.[].number'); do
            gh issue close "$number" --comment "Recovered. Run: $RUN_URL"
          done
